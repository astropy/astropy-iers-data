# This workflow is to run tests on regular pushes and pull requests - it is
# separate from the tests that get run during an auto-update, which can be
# found in update_and_publish.yml

name: Run tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  tests:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@1285b95e32c783cfa40eb2ffbd6ca4cd023fb884  # v3.2.2
    with:
      envs: |
        - linux: py311-test
        - linux: py312-test
        - linux: py313-test
        - linux: py314-test
        - linux: py315-test-astropydev
        - macos: py311-test
        - macos: py314-test
        - windows: py311-test
        - windows: py314-test
